name: Daily IG publish

on:
  schedule:
    # 14:30 UTC = 10:30 AM ET (NJ-friendly posting time)
    - cron: "30 14 * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Publish today's brief
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_PUBLIC_URL_TEMPLATE: ${{ secrets.IMAGE_PUBLIC_URL_TEMPLATE }}
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED || 'true' }}
        run: python publish_brief.py
