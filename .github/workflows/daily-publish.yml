name: Daily IG publish

on:
  schedule:
    # 14:30 UTC = 10:30 AM ET (NJ-friendly posting time)
    - cron: "30 14 * * *"
  workflow_dispatch:
    inputs:
      preview:
        description: "Preview only (skip the actual IG publish call). Safe to run."
        type: boolean
        default: true
      topic:
        description: "Override today's topic (leave blank for the rotation)."
        type: string
        default: ""

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Publish today's brief
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED || 'true' }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.preview }}" = "true" ]; then
            ARGS="$ARGS --preview"
          fi
          if [ -n "${{ inputs.topic }}" ]; then
            ARGS="$ARGS --topic \"${{ inputs.topic }}\""
          fi
          echo "Running: python publish_brief.py $ARGS"
          eval "python publish_brief.py $ARGS"
